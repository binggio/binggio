[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binggio"
version = "0.1.1"
description = "Governed answers from your data: approved meanings only, refusals instead of guesses."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Ashish Kumar", email = "ashish@binggio.com"}]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["data governance", "semantic layer", "mcp", "csv", "sql", "data catalog"]
dependencies = []

[project.urls]
Homepage = "https://www.binggio.com"
Source = "https://github.com/binggio/binggio"
Issues = "https://github.com/binggio/binggio/issues"
Releases = "https://github.com/binggio/binggio/releases"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
sqlserver = ["pymssql>=2.3"]
oracle = ["oracledb>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
all = ["openpyxl>=3.1", "pymssql>=2.3", "oracledb>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
binggio = "binggio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binggio = ["demo_bank/**/*", "ui/static/*", "ui/*.json"]
