name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev,excel]"
      - name: Run the tests
        run: python -m pytest -q tests

  package:
    name: Build and try the package as a user would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree
        run: python tools/check_version.py
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/user
          /tmp/user/bin/pip install dist/*.whl
          cd /tmp
          /tmp/user/bin/binggio --version
          /tmp/user/bin/binggio demo /tmp/bank
          /tmp/user/bin/binggio -w /tmp/bank status
          BINGGIO_WORKSPACE=/tmp/bank /tmp/user/bin/binggio connect claude-desktop --print
      - name: The MCP server answers a handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | /tmp/user/bin/binggio -w /tmp/bank mcp | grep -q '"serverInfo"'
      - name: Build the Claude Desktop bundle folder
        run: python tools/build_mcpb.py --out /tmp/mcpb
