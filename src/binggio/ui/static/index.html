<html lang="en">
<head>

<title>Binggio</title>

<style>
:root{
  --paper:#f4f6f9; --panel:#ffffff; --line:#dfe4ec; --line2:#eef1f5;
  --ink:#14233a; --muted:#5f6f84; --faint:#8a97a8;
  --nav:#101f36; --nav2:#1a2c48; --navink:#c9d4e4;
  --blue:#4b3fd8; --blue2:#eeedfc; --dot:#4b3fd8; --dotnav:#8b83f0;
  --green:#13846e; --green2:#e3f3ef;
  --amber:#ae6910; --amber2:#fbf0df;
  --red:#b4232f; --red2:#fbe7e9;
  --slate:#7b8798; --slate2:#eef0f3;
  --r:10px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--font);color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:22px;line-height:1.25;font-weight:650;margin:0}
h2{font-size:16px;font-weight:650;margin:0 0 10px}
h3{font-size:14px;font-weight:650;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{background:var(--nav);color:var(--navink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 10px;color:#fff}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;line-height:1}
.logo svg{flex:none}
.logo sup{font-size:9px;font-weight:500;letter-spacing:0;margin-left:-6px;align-self:flex-start;opacity:.8}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--navink);opacity:.85;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--navink);padding:9px 18px;border-left:3px solid transparent}
nav.side a:hover{background:var(--nav2);text-decoration:none;color:#fff}
nav.side a.on{background:var(--nav2);color:#fff;border-left-color:var(--dotnav)}
nav.side .grow{flex:1}
nav.side .foot{padding:12px 18px;font-size:12px;opacity:.75}
.badge{background:#ffb84d;color:#2b1a00;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--slate)}
.chip.ok .dot{background:var(--green)} .chip.warn .dot{background:var(--amber)}
.page{padding:22px 26px 60px;max-width:1280px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel.flush{padding:0}
.panel>.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel>.head h2{margin:0;flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#b9c4d4}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#3c31c0}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{color:var(--red);border-color:#efc4c8}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12.5px}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>input,label.f>select{color:var(--ink);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfd;position:sticky;top:0}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:#fafbfd}
table.t td.num,table.t th.num{text-align:right}
.scroll{overflow:auto;max-height:560px}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.s-approved{background:var(--green2);color:var(--green)}
.s-pending,.s-draft{background:var(--amber2);color:var(--amber)}
.s-stale{background:var(--red2);color:var(--red)}
.s-rejected,.s-revoked,.s-not_profiled{background:var(--slate2);color:var(--slate)}
.s-profiled{background:var(--green2);color:var(--green)}
.k-entity,.k-reference{background:var(--blue2);color:var(--blue)}
.k-extends,.k-records{background:var(--green2);color:var(--green)}
.k-duplicate{background:var(--red2);color:var(--red)}
.k-standalone{background:var(--slate2);color:var(--slate)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{white-space:nowrap}
.tabs a{padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550}
.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
.tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs .n{color:var(--faint);font-weight:400;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:16px}
.stat{padding:14px 18px;border-right:1px solid var(--line2)} .stat:last-child{border-right:0}
.stat b{display:block;font-size:26px;font-weight:650;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
.stat.warn b{color:var(--amber)} .stat.bad b{color:var(--red)} .stat.good b{color:var(--green)}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);font-weight:650;font-size:13px}
ol.steps li.done::before{content:"✓";background:var(--green);border-color:var(--green);color:#fff}
ol.steps li.now::before{border-color:var(--blue);color:var(--blue)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;max-width:420px;box-shadow:0 6px 24px rgba(16,31,54,.25)}
.toast div.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(16,31,54,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(16,31,54,.35)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .mh h2{flex:1;margin:0}
.modal .mb{padding:14px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fs a{display:flex;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink)} .fs a:hover{background:var(--paper);text-decoration:none}
.fs .ico{width:18px;text-align:center;color:var(--faint)}
.fs a.sel{background:var(--blue2);color:var(--blue)} .fs a input{margin:0 4px 0 2px;pointer-events:none}
.fs:focus{outline:none}
.job{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fafbfd;margin-top:12px}
.job li{list-style:none;padding:3px 0}
.job li::before{display:inline-block;width:20px;content:"○";color:var(--faint)}
.job li.running::before{content:"◐";color:var(--blue);animation:spin 1s linear infinite}
.job li.done::before{content:"✓";color:var(--green)}
.job li.failed::before{content:"✕";color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.job li.running::before{animation:none}}
.err-box{background:var(--red2);color:var(--red);border-radius:8px;padding:10px 12px;margin:10px 0}
.note-box{background:var(--blue2);color:#2e2690;border-radius:8px;padding:10px 12px;margin:10px 0}
.warn-box{background:var(--amber2);color:#7a4a08;border-radius:8px;padding:10px 12px;margin:10px 0}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.split>*,.grid2>*{min-width:0}
.list a{display:block;padding:6px 10px;border-radius:6px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a:hover{background:var(--paper);text-decoration:none} .list a.on{background:var(--blue2);color:var(--blue);font-weight:600}
.list .grp{font-size:12px;color:var(--muted);padding:10px 10px 4px;font-weight:600}
/* ask */
.ask{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.thread{display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:80%}
.a{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.a .ah{padding:12px 16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.a .ah b{font-size:15px}
.a .tablewrap{max-height:380px;overflow:auto;border-top:1px solid var(--line2)}
.prov{border-top:1px solid var(--line);background:#f7f9fc;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.prov dt{color:var(--muted)} .prov dd{margin:0}
.prov .src{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:0 4px 4px 0}
.prov .term{display:block;margin-bottom:3px}
.refusal{border-color:#efc4c8} .refusal .ah{background:var(--red2)}
.composer{position:sticky;bottom:0;background:var(--paper);padding:12px 0 4px;display:flex;gap:8px}
.composer textarea{flex:1;resize:none;height:46px;padding:11px 12px;border-radius:10px}
.samples button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.samples button:hover{border-color:var(--blue)}
details summary{cursor:pointer;color:var(--blue)}
pre{white-space:pre-wrap;word-break:break-word;background:#f3f5f8;border-radius:6px;padding:8px;font-size:12px;margin:6px 0 0}
/* start */
.start{min-height:100vh;display:grid;grid-template-columns:minmax(300px,440px) 1fr}
.start .left{background:var(--nav);color:var(--navink);padding:48px 40px;display:flex;flex-direction:column;gap:16px}
.start .left h1{color:#fff;font-size:34px}
.start .left p{max-width:34ch}
.start .right{padding:48px 44px;max-width:760px}
.choice{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.choice p{margin:0;grid-column:1}
.choice .btn{grid-row:1 / span 2;grid-column:2}
/* graph */
.graph{position:relative;height:640px;background:#fbfcfe;border-radius:var(--r);overflow:hidden}
.graph svg{width:100%;height:100%;cursor:grab}
.graph text{font-size:11px;fill:var(--ink);pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.side-panel{position:absolute;right:12px;top:12px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 8px 30px rgba(16,31,54,.15)}

/* story */
.story{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.fact.headline{grid-column:1 / -1;background:var(--nav);border-color:var(--nav);color:#fff}
.fact.headline h2{font-size:26px;line-height:1.25;color:#fff;margin:0}
.fact.headline .why{color:var(--navink)}
.fact .kind{font-size:12.5px;color:var(--muted);font-weight:600}
.fact h2{font-size:17px;line-height:1.35;margin:0}
.fact .why{font-size:12.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:minmax(80px,max-content) 1fr auto;gap:5px 10px;align-items:center;font-size:12.5px;margin-top:4px}
.bars .track{height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--blue);border-radius:3px}
.bars .fill.top{background:var(--green)}
.bars .v{color:var(--muted);text-align:right}
.spark{width:100%;height:120px}
.from{font-size:12px;color:var(--faint)}
@media (max-width:980px){.story{grid-template-columns:1fr}}
@media (max-width:980px){
  .app{grid-template-columns:1fr} nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap} nav.side .grow,nav.side .foot{display:none}
  .stats{grid-template-columns:repeat(2,1fr)} .grid2,.grid3,.split,.ask,.start{grid-template-columns:1fr}
  .page{padding:16px} .top{padding:12px 16px;flex-wrap:wrap} .graph{height:480px}
}
.demo-band{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 26px 0;max-width:1228px;padding:10px 14px;border-radius:10px;background:var(--blue2);border:1px solid var(--line);font-size:14px}
.demo-band span{flex:1;min-width:200px;color:var(--muted)}
@media (max-width:700px){.demo-band{margin:12px 16px 0}}
.drawer-bg{position:fixed;inset:0;background:rgba(16,31,54,.35);z-index:35}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--panel);z-index:36;box-shadow:-12px 0 40px rgba(16,31,54,.25);display:flex;flex-direction:column}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .dh h2{flex:1;margin:0;font-size:17px;line-height:1.35;word-break:break-word}
.drawer .db{padding:16px 18px 40px;overflow:auto;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:19px;font-weight:650}.kpi span{color:var(--muted);font-size:12px}
.sec{margin-top:20px}.sec h3{font-size:14px;margin:0 0 8px}
.sidecard{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;overflow-wrap:anywhere}
.drawer .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sidecard .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.vals{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.vals code{background:var(--paper);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px}
.checks{margin:0;padding-left:18px}.checks li{margin:4px 0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0}.dl dt{color:var(--muted)}.dl dd{margin:0}
@media (max-width:700px){.drawer .grid2{grid-template-columns:1fr}}
ol.fixes{margin:0 0 8px;padding-left:20px} ol.fixes li{margin:0 0 8px}
.checkcols{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0;max-height:150px;overflow:auto}
.checkcols label{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* Explore: the fix and key panels fit the page whatever the width of the table above them */
.tools2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.tools2>*{min-width:0}
.tools2 table.t{table-layout:fixed} .tools2 td,.tools2 code,ol.fixes b,ol.fixes .small{overflow-wrap:anywhere;word-break:break-word}
#td .panel{min-width:0;max-width:100%}
#gsvg line[marker-end]{pointer-events:stroke}
</style>

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const TOKEN = '__BINGGIO_TOKEN__';
const LOGO = (size, ink, dot) => `<svg width="${size}" height="${size}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108"><g fill="none" stroke="${ink}" stroke-width="13" stroke-linejoin="round"><path d="M6.5 41V10.5a4 4 0 0 1 4-4H41"/><path d="M67 6.5h30.5a4 4 0 0 1 4 4V41"/><path d="M101.5 67v30.5a4 4 0 0 1-4 4H67"/><path d="M41 101.5H10.5a4 4 0 0 1-4-4V67"/></g><circle cx="54" cy="54" r="17.5" fill="${dot}"/></svg>`;

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString();
const store = {get(k,d){try{const v=localStorage.getItem('binggio.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('binggio.'+k,JSON.stringify(v))}catch(e){}}};

/* Every page load gets a navigation number. A reply that arrives after the person has moved to
   another page is dropped (a "stale" error that nothing shows), so a slow page can never write
   into the page that replaced it ("Cannot set properties of null") or wipe it. */
let NAVSEQ = 0;
class Stale extends Error { constructor() { super('stale'); this.stale = true; } }
async function api(path, body) {
  const at = NAVSEQ;
  const opt = {headers: {'X-Binggio-Token': TOKEN}};
  if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  let r;
  try { r = await fetch(path, opt); } catch (e) { throw new Error('Binggio is not running. Start it again with: binggio ui'); }
  const data = await r.json().catch(() => ({error: 'Unexpected reply from Binggio'}));
  if (at !== NAVSEQ && body === undefined) throw new Stale();
  if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
  return data;
}
function toast(msg, err) {
  const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err';
  $('#toast').appendChild(d); setTimeout(() => d.remove(), err ? 7000 : 3500);
}
const fail = e => { if (e && e.stale) return; toast(e.message || String(e), true); };

const ROLE = {PRIMARY_KEY_CANDIDATE:'Primary key', FOREIGN_KEY_CANDIDATE:'Foreign key', IDENTIFIER:'Identifier', MEASURE:'Measure',
  DATE:'Date', CLASSIFICATION:'Category', STATUS:'Status', TEXT:'Text', UNKNOWN:'Unknown'};
const ROLES = Object.keys(ROLE);
const STATUS = {approved:'Approved', pending:'Waiting', rejected:'Rejected', stale:'Data changed', revoked:'Revoked', draft:'Draft',
  profiled:'Profiled', not_profiled:'Not profiled'};

/* ------------------------------------------------------------------ reviewer name */
function reviewer() { return store.get('by', ''); }
async function needReviewer() {
  if (reviewer()) return reviewer();
  const name = await askText('Your name', 'Every approval is recorded with the name of the person who made it.', 'Name', '');
  if (!name) throw new Error('A name is needed to record decisions');
  store.set('by', name.trim()); renderTop(); return name.trim();
}

/* ------------------------------------------------------------------ modals */
function modal(title, bodyHtml, buttons) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2>
      <button class="btn ghost" data-x aria-label="Close">✕</button></div><div class="mb">${bodyHtml}</div><div class="mf"></div></div>`;
    const close = v => { bg.remove(); resolve(v); };
    for (const [label, cls, val] of buttons) {
      const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
      b.onclick = () => close(typeof val === 'function' ? val(bg) : val); $('.mf', bg).appendChild(b);
    }
    $('[data-x]', bg).onclick = () => close(null);
    bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(null); });
    document.body.appendChild(bg);
    (bg.querySelector('input,select,textarea,.mf .primary') || bg.querySelector('button')).focus();
    bg._close = close;
  });
}
function askText(title, help, label, value, type) {
  return modal(title, `<p class="muted">${esc(help)}</p><label class="f">${esc(label)}<input type="${type||'text'}" id="m-in" value="${esc(value)}"></label>`,
    [['Cancel', '', null], ['Save', 'primary', bg => $('#m-in', bg).value.trim() || null]]);
}
function confirmBox(title, text, ok) { return modal(title, `<p>${text}</p>`, [['Cancel', '', false], [ok || 'Continue', 'primary', true]]); }

/* File and folder picker (the browser cannot see paths, so Binggio lists them).
   In CSV mode several files can be chosen: click, Ctrl+click, Shift+click, Ctrl+A.
   Resolves to a path, an array of paths (several files) or null. */
function pick(want, ext, start) {
  return new Promise(resolve => {
    const multi = want === 'csvdir';
    let current = start || store.get('lastdir', '') || (S.state && S.state.home) || '';
    let files = [], chosen = new Set(), anchor = null;
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    const title = want === 'file' ? 'Choose a file' : multi ? 'Choose a folder of CSV files, or select files' : 'Choose a folder';
    bg.innerHTML = `<div class="modal"><div class="mh"><h2>${title}</h2><button class="btn ghost" data-x aria-label="Close">✕</button></div>
      <div class="mb"><div class="row" style="margin-bottom:8px"><input type="text" id="fs-path" style="flex:1"><button class="btn" id="fs-go">Go</button></div>
      <div class="row small" id="fs-roots" style="margin-bottom:8px"></div>
      ${multi ? '<p class="muted small" style="margin:0 0 6px">Click a file to select it. Ctrl+click adds or removes one, Shift+click selects a range, Ctrl+A selects all.</p>' : ''}
      <div class="fs" id="fs-list" tabindex="-1"></div></div>
      <div class="mf"><span class="muted small" id="fs-info" style="flex:1"></span><button class="btn" data-x>Cancel</button>
      ${multi ? '<button class="btn" id="fs-files" disabled>Use selected files</button>' : ''}
      ${want !== 'file' ? '<button class="btn primary" id="fs-use">Use this folder</button>' : ''}</div></div>`;
    document.body.appendChild(bg);
    const close = v => {
      bg.remove();
      if (v) store.set('lastdir', Array.isArray(v) ? v[0].replace(/[\\/][^\\/]*$/, '') : want === 'file' ? v.replace(/[\\/][^\\/]*$/, '') : v);
      resolve(v);
    };
    $$('[data-x]', bg).forEach(b => b.onclick = () => close(null));
    const paint = () => {
      $$('[data-f]', bg).forEach(a => { const on = chosen.has(a.dataset.f); a.classList.toggle('sel', on); a.setAttribute('aria-selected', on); const c = a.querySelector('input'); if (c) c.checked = on; });
      if (multi) {
        const n = chosen.size, b = $('#fs-files', bg);
        b.disabled = !n; b.textContent = n ? `Use ${n} selected file${n === 1 ? '' : 's'}` : 'Use selected files';
        b.classList.toggle('primary', n > 0); $('#fs-use', bg).classList.toggle('primary', !n);
      }
    };
    bg.addEventListener('keydown', e => {
      if (e.key === 'Escape') return close(null);
      if (multi && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && e.target.id !== 'fs-path') {
        e.preventDefault(); chosen = new Set(files); paint();
      }
    });
    const load = async p => {
      try {
        const d = await api('/api/fs?want=' + want + '&ext=' + encodeURIComponent(ext || '') + '&path=' + encodeURIComponent(p || ''));
        current = d.path; $('#fs-path', bg).value = d.path; chosen = new Set(); anchor = null;
        files = d.entries.filter(e => e.type === 'file').map(e => e.path);
        $('#fs-roots', bg).innerHTML = [`<a href="#" data-p="${esc(d.home)}">Home</a>`, ...d.roots.map(r => `<a href="#" data-p="${esc(r)}">${esc(r)}</a>`)].join(' · ');
        $('#fs-list', bg).innerHTML = (d.parent ? `<a href="#" data-p="${esc(d.parent)}"><span class="ico">↰</span>Up one folder</a>` : '') +
          d.entries.map(e => e.type === 'dir'
            ? `<a href="#" data-p="${esc(e.path)}"><span class="ico">▸</span>${esc(e.name)}${e.workspace ? ' <span class="pill s-approved">workspace</span>' : ''}${e.csv ? ' <span class="pill k-entity">CSV</span>' : ''}</a>`
            : `<a href="#" data-f="${esc(e.path)}" role="option" aria-selected="false">${multi ? '<input type="checkbox" tabindex="-1" aria-hidden="true">' : '<span class="ico">▫</span>'}${esc(e.name)} <span class="faint small">${fmt(Math.round(e.size/1024))} KB</span></a>`).join('') ||
          '<div class="empty">Nothing to show here</div>';
        $('#fs-info', bg).textContent = multi ? `${d.csv_here} CSV file${d.csv_here === 1 ? '' : 's'} in this folder` : (d.workspace_here ? 'This folder is a Binggio workspace' : '');
        $$('[data-p]', bg).forEach(a => a.onclick = ev => { ev.preventDefault(); load(a.dataset.p); });
        $$('[data-f]', bg).forEach(a => {
          a.onclick = ev => {
            ev.preventDefault();
            if (!multi) return close(a.dataset.f);
            const f = a.dataset.f;
            if (ev.shiftKey && anchor) {
              const i = files.indexOf(anchor), j = files.indexOf(f);
              if (!(ev.ctrlKey || ev.metaKey)) chosen = new Set();
              files.slice(Math.min(i, j), Math.max(i, j) + 1).forEach(x => chosen.add(x));
            } else if (ev.ctrlKey || ev.metaKey || ev.target.tagName === 'INPUT') {
              chosen.has(f) ? chosen.delete(f) : chosen.add(f); anchor = f;
            } else { chosen = new Set([f]); anchor = f; }
            paint();
          };
          a.ondblclick = ev => { ev.preventDefault(); if (multi) close([a.dataset.f]); };
        });
        paint(); $('#fs-list', bg).focus();
      } catch (e) { fail(e); }
    };
    $('#fs-go', bg).onclick = () => load($('#fs-path', bg).value);
    $('#fs-path', bg).addEventListener('keydown', e => { if (e.key === 'Enter') load(e.target.value); });
    if ($('#fs-use', bg)) $('#fs-use', bg).onclick = () => close(current);
    if ($('#fs-files', bg)) $('#fs-files', bg).onclick = () => chosen.size && close(files.filter(f => chosen.has(f)));
    load(current);
  });
}

/* ------------------------------------------------------------------ jobs */
function watchJob(job, el, onDone) {
  const draw = j => {
    el.innerHTML = `<div class="job"><ul style="margin:0;padding:0">${j.steps.map(s => `<li class="${s.status}">${esc(s.name)}${s.detail ? ' · ' + esc(s.detail) : ''}</li>`).join('')}</ul>
      ${j.status === 'failed' ? `<div class="err-box">${esc(j.error)}</div>` : ''}${j.status === 'done' ? `<p class="muted small" style="margin:8px 0 0">Finished in ${j.seconds} s</p>` : ''}</div>`;
  };
  draw(job);
  const tick = async () => {
    try {
      const j = await api('/api/jobs/' + job.id); draw(j);
      if (j.status === 'running') return setTimeout(tick, 700);
      if (onDone) onDone(j);
    } catch (e) { fail(e); }
  };
  setTimeout(tick, 500);
}

}

/* ------------------------------------------------------------------ router */
const ROUTES = {home: pageHome, sources: pageSources, explore: pageExplore, onboard: pageOnboard, review: pageReview,
  graph: pageGraph, story: pageStory, ask: pageAsk, activity: pageActivity, settings: pageSettings};
async function route() {
  if (!S.state) return;
  if (!S.state.workspace) return startScreen();
  if (!$('.app')) shell();
  const [key, ...rest] = (location.hash.slice(1) || 'home').split('/').map(decodeURIComponent);
  const fn = ROUTES[key] || pageHome;
  const nav = ++NAVSEQ;
  try { await fn(...rest); } catch (e) {
    if (e.stale || nav !== NAVSEQ) return;          // the person moved on; this page's late reply is not shown
    const p = $('#page'); if (p) p.innerHTML = `<div class="err-box">${esc(e.message)}</div>`;
  }
  if (nav === NAVSEQ) refreshBadges();
}
window.addEventListener('hashchange', route);

function sourcesTable(items) {
  if (!items.length) return '<div class="empty">No data yet. <a href="#sources">Add your first source</a>.</div>';
  return `<table class="t"><tr><th>Source</th><th>Type</th><th class="num">Tables</th><th>Profiles</th><th></th></tr>${items.map(s => `<tr>
    <td><b>${esc(s.name)}</b><div class="faint small">${esc(s.id)}</div></td><td>${esc(SRC[s.kind] || s.kind)}</td><td class="num">${fmt(s.tables)}</td>
    <td>${s.stale ? `<span class="pill s-stale">${s.stale} changed</span> ` : ''}${s.not_profiled ? `<span class="pill s-not_profiled">${s.not_profiled} not profiled</span> ` : ''}${!s.stale && !s.not_profiled ? pill('profiled') : ''}</td>
    <td style="text-align:right"><a class="btn sm" href="#onboard/${encodeURIComponent(s.id)}">Onboard</a> <a class="btn sm" href="#explore/${encodeURIComponent(s.id)}">Explore</a>
    ${s.refreshable && !S.state.demo ? `<button class="btn sm" data-refresh="${esc(s.id)}" data-kind="${esc(s.kind)}" data-user="${esc((s.origin || {}).user || '')}">Refresh</button>` : ''}</td></tr>`).join('')}</table><div id="src-job" style="padding:0 18px 12px"></div>`;
}
function bindSourceActions(p) {
  $$('[data-refresh]', p).forEach(b => b.onclick = async () => {
    try {
      let password = null;
      if (!['excel', 'sqlite'].includes(b.dataset.kind) && b.dataset.user) {
        password = await askText('Password for ' + b.dataset.user, 'Used for this refresh only and never stored.', 'Password', '', 'password');
        if (password === null) return;
      }
      const job = await api('/api/sources/refresh', {connection: b.dataset.refresh, password});
      watchJob(job, $('#src-job', p), j => {
        if (j.status === 'done') {
          const r = j.result; toast(r.changed_tables.length ? 'Changed: ' + r.changed_tables.join(', ') : 'No table changed');
          setTimeout(route, 1200);
        }
      });
    } catch (e) { fail(e); }
  });
}
function eventsList(items) {
  if (!items || !items.length) return '<div class="muted">No decisions yet.</div>';
  const verb = {approve: 'approved', reject: 'rejected', revoke: 'revoked', reopen: 'reopened', draft: 'drafted', revise: 'revised', migrate_fingerprint: 're-bound'};
  return `<table class="t">${items.map(e => {
    const ev = e.event || {}, pr = ev.approved || ev.proposed || {};
    const what = e.artifact_id.startsWith('column_role') ? `column ${esc(pr.table || '')}.${esc(pr.column || '')}${pr.role ? ' as ' + esc(ROLE[pr.role] || pr.role) : ''}`
      : e.artifact_id.startsWith('relationship') ? `link ${esc(pr.child_table || (pr.candidate || {}).child_table || '')} → ${esc(pr.parent_table || (pr.candidate || {}).parent_table || '')}`
      : esc(pr.name || e.artifact_id.split(':')[0]);
    return `<tr><td style="width:170px" class="muted small">${esc(String(e.at).replace('T', ' ').slice(0, 16))}</td><td><b>${esc(e.actor)}</b> ${esc(verb[e.action] || e.action)} ${what}<div class="faint small">${esc(e.note)}</div></td></tr>`;
  }).join('')}</table>`;
}

  $$('#src-tabs a').forEach(a => a.onclick = e => { e.preventDefault(); typ = a.dataset.t; draw(); });

    <p class="muted small">${d.profiled ? `Profiled from ${fmt(d.sample_rows)} rows${d.sample_complete ? ' (all rows)' : ' (a sample)'}${d.preview.row_count != null ? ' · ' + fmt(d.preview.row_count) + ' rows in the table' : ''}.` : 'Not profiled yet.'}
      ${(d.fixes || []).length ? ` <b>${d.fixes.length} data fix${d.fixes.length === 1 ? '' : 'es'}</b> applied when this table is read.` : ''}</p>
    <div class="scroll"><table class="t"><tr><th>Column</th><th>Type</th><th class="num">Distinct</th><th class="num">Empty</th><th>Suggested role</th><th>Approved</th><th></th></tr>
    ${d.columns.map(c => `<tr><td><b>${esc(c.name)}</b>${c.declared_key ? ' <span class="pill k-entity">declared key</span>' : ''}${fixedCols.has(c.name) ? ' <span class="pill k-extends" title="A data fix changes how this column is read">fixed</span>' : ''}${c.findings.length ? `<div class="faint small">${c.findings.map(f => esc(f.message || f.detail || f.code || f)).join('; ')}</div>` : ''}</td>
      <td>${esc(c.type)}</td><td class="num">${fmt(c.distinct)}</td><td class="num">${c.missing_pct == null ? '–' : c.missing_pct + '%'}</td>

    <div class="panel"><div class="head"><h2>Relationships</h2>${S.state.demo ? '' : `<button class="btn sm" id="ex-link">Add a relationship</button>`}</div>${d.links.length ? `<table class="t"><tr><th>From</th><th>To</th><th class="num">Score</th></tr>${d.links.map(l => `<tr>
      <td>${esc(l.child.table)}.<b>${esc(l.child.column)}</b></td><td>${esc(l.parent.table)}.<b>${esc(l.parent.column)}</b></td><td class="num">${l.score.toFixed(2)}</td></tr>`).join('')}</table>
      <p style="margin-top:10px"><a href="#review/relationships//${encodeURIComponent(table)}">Review these links</a></p>` : `<p class="muted">No candidate relationships found for this table. <a href="#review/relationships/all">See why</a>, or add one yourself.</p>`}</div>

  const reload = () => pageExplore(cid, table).catch(fail);
  $$('[data-fixcol]', td).forEach(b => b.onclick = () => fixModal(cid, table, {column: b.dataset.fixcol}, reload));
  if ($('#fx-add')) $('#fx-add').onclick = () => fixModal(cid, table, {}, reload);
  if ($('#ex-link')) $('#ex-link').onclick = () => linkModal({child: {connection: cid, table}}, reload);
  fixesPanel(cid, table, reload).catch(e => { if (!e.stale && $('#fx-body')) $('#fx-body').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; });
  keyTools(cid, table, d, reload);

/* ------------------------------------------------------------------ data fixes */
const FIX_HELP = {
  trim: 'Spaces at the start or end make "C001 " and "C001" different keys.',
  case: 'Codes written in mixed case ("Open", "OPEN") become one value.',
  number: 'Currency signs, thousands separators, units and % are removed: "$1,234.50" becomes 1234.5, "(500)" becomes -500. Values with no number become empty.',
  replace: 'Exact values are replaced, for example N/A or - with empty, or Y with YES.',
  missing: 'Empty values are filled. The average, median or most common value is worked out on the whole table each time it is read.',
  pad: 'Keys written without leading zeros ("42") are padded ("000042") so they match the other table.',
  strip_prefix: 'A prefix such as "CUST-" is removed so the key matches the other table.',
  add_prefix: 'A prefix such as "C" is added so the key matches the other table.',
  digits: 'Only the digits are kept: "CUST-000042" becomes 000042 (or 42 without leading zeros).',
  date: 'Dates written as 03/04/2026 are read in the form you choose and stored as 2026-04-03.',
  combine: 'A new column joins several columns ("L001|C042"): a key made of two columns, for a table no single column identifies.',
  dedupe: 'Only the first row for each key value is kept; later rows with the same key are left out when the table is read.'};
async function fixesPanel(cid, table, reload) {
  const d = await api('/api/fixes?connection=' + encodeURIComponent(cid) + '&table=' + encodeURIComponent(table));
  const el = $('#fx-body'); if (!el) return;
  const notes = (d.prepared || {}).notes || {};
  el.innerHTML = `${d.active.length ? `<ol class="fixes">${d.active.map(f => { const n = notes[f.id];
      return `<li><div class="row"><b style="flex:1">${esc(f.label)}</b>${S.state.demo ? '' : `<button class="btn ghost sm" data-rm="${esc(f.id)}">Remove</button>`}</div>
      <div class="small muted">${esc(f.note)} · ${esc(f.created_by)}, ${esc(String(f.created_at).slice(0, 10))}${n && n.rows_changed != null ? ` · ${fmt(n.rows_changed)} rows changed${n.filled_with != null ? ' (filled with ' + esc(n.filled_with) + ')' : ''}` : ''}</div></li>`; }).join('')}</ol>`
    : `<p class="muted">No data fixes. Fixes correct how this table is read (spaces, number formats, missing values, key formats, duplicates) without changing the source file, and are applied again every time the data is refreshed.</p>`}
    ${d.removed.length ? `<details><summary class="small">${d.removed.length} removed fix${d.removed.length === 1 ? '' : 'es'}</summary><ul class="small muted">${d.removed.map(f => `<li>${esc(f.label)}: removed by ${esc(f.removed_by)} (${esc(f.removed_note || '')})</li>`).join('')}</ul></details>` : ''}
    <div id="fx-job"></div>`;
  $$('[data-rm]', el).forEach(b => b.onclick = async () => {
    try {
      const by = await needReviewer();
      const note = await askText('Remove this fix', 'The table is read without it from now on; approvals on this table will need re-confirming.', 'Why is it removed?', '');
      if (!note) return;
      const r = await api('/api/fixes', {action: 'remove', id: b.dataset.rm, connection: cid, table, by, note});
      watchJob(r.job, $('#fx-job'), j => { if (j.status === 'done') { toast('Fix removed'); reload(); } });
    } catch (e) { fail(e); }
  });
}
function fixParams(kind, cols, preset) {
  const colChecks = (name, chosen) => `<div class="checkcols">${cols.map(c => `<label class="small"><input type="checkbox" name="${name}" value="${esc(c)}" ${chosen.includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>`;
  const p = preset.params || {};
  switch (kind) {
    case 'case': return `<label class="f">Change to<select id="fp-to"><option value="upper">UPPER CASE</option><option value="lower">lower case</option></select></label>`;
    case 'replace': return `<div class="fields"><label class="f">Values to replace (separate with commas)<input id="fp-values" placeholder="N/A, -, unknown" value="${esc((p.values || []).join(', '))}"></label>
      <label class="f">Replace with (leave empty for an empty value)<input id="fp-to" value="${esc(p.to || '')}"></label></div>`;
    case 'missing': return `<div class="fields"><label class="f">Fill with<select id="fp-with"><option value="value">A value I give</option><option value="zero">0</option><option value="mean">The average (numbers)</option><option value="median">The median (numbers)</option><option value="most_common">The most common value</option></select></label>
      <label class="f">Value<input id="fp-value" placeholder="e.g. UNKNOWN"></label></div>`;
    case 'pad': return `<div class="fields"><label class="f">Width<input id="fp-width" type="number" min="1" max="64" value="${esc(p.width || 6)}"></label><label class="f">Pad with<input id="fp-char" maxlength="1" value="${esc(p.char || '0')}"></label></div>`;
    case 'strip_prefix': return `<div class="fields"><label class="f">Text to remove at the start<input id="fp-text" placeholder="CUST-" value="${esc(p.text || '')}"></label><label class="small" style="align-self:end"><input type="checkbox" id="fp-ic" checked> Ignore upper/lower case</label></div>`;
    case 'add_prefix': return `<label class="f">Text to add at the start<input id="fp-text" placeholder="C" value="${esc(p.text || '')}"></label>`;
    case 'digits': return `<label class="small"><input type="checkbox" id="fp-dz" ${p.drop_leading_zeros ? 'checked' : ''}> Also remove leading zeros (000042 becomes 42)</label>`;
    case 'date': return `<label class="f">The column's dates look like<select id="fp-fmt">${(S.fixInfo.date_formats || []).map(f => `<option value="${esc(f)}">${esc(f.replace('%d', 'DD').replace('%m', 'MM').replace('%Y', 'YYYY').replace('%y', 'YY').replace('%b', 'Mon').replace('%H:%M:%S', 'hh:mm:ss'))}</option>`).join('')}</select></label>`;
    case 'combine': return `<label class="f">Name of the new column<input id="fp-name" placeholder="loan_key" value="${esc(preset.name || '')}"></label><div class="small muted">Columns to combine, in this order:</div>${colChecks('fp-cols', p.columns || [])}
      <label class="f" style="max-width:160px">Separator<input id="fp-sep" maxlength="3" value="${esc(p.sep || '|')}"></label>`;
    case 'dedupe': return `<div class="small muted">Key column(s): rows that repeat these values are left out, keeping the first.</div>${colChecks('fp-cols', p.columns || [])}`;
    default: return '';
  }
}
function readFixParams(kind, bg) {
  const v = id => ($('#' + id, bg) || {}).value;
  const ch = id => !!($('#' + id, bg) || {}).checked;
  const cols = () => $$('input[name="fp-cols"]', bg).filter(x => x.checked).map(x => x.value);
  switch (kind) {
    case 'case': return {to: v('fp-to')};
    case 'replace': return {values: v('fp-values'), to: v('fp-to')};
    case 'missing': return {with: v('fp-with'), value: v('fp-value')};
    case 'pad': return {width: +v('fp-width'), char: v('fp-char')};
    case 'strip_prefix': return {text: v('fp-text'), ignore_case: ch('fp-ic')};
    case 'add_prefix': return {text: v('fp-text')};
    case 'digits': return {drop_leading_zeros: ch('fp-dz')};
    case 'date': return {format: v('fp-fmt')};
    case 'combine': return {columns: cols(), sep: v('fp-sep')};
    case 'dedupe': return {columns: cols()};
    default: return {};
  }
}
async function fixModal(cid, table, preset, onDone) {
  try {
    const info = S.fixInfo = await api('/api/fixes?connection=' + encodeURIComponent(cid) + '&table=' + encodeURIComponent(table));
    const kinds = Object.entries(info.kinds);
    let kind = preset.kind || 'trim';
    const body = `<p class="muted small" style="margin-top:0">A data fix changes how Binggio reads <b>${esc(table)}</b>, never the source file, and is applied again whenever the data is refreshed. Approvals on this table will need re-confirming afterwards, because the data they were made on changes.</p>
      <div class="fields"><label class="f">What to do<select id="fx-kind">${kinds.map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      <label class="f" id="fx-colwrap">Column<select id="fx-col">${info.columns.map(c => `<option ${c === preset.column ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label></div>
      <p class="small muted" id="fx-help"></p><div id="fx-params"></div>
      <label class="f">Why this fix is right (kept with it)<textarea id="fx-note" rows="2" maxlength="600" placeholder="e.g. the export pads keys with spaces"></textarea></label>
      <div class="row"><button class="btn sm" id="fx-try">Preview on the first rows</button></div><div id="fx-prev"></div>`;
    S.fixCtx = {cid, table};
    const done = modal('Add a data fix', body, [['Cancel', '', null], ['Add the fix', 'primary', null]]);
    const bg = [...document.querySelectorAll('.modal-bg')].pop();
    const save = [...$$('.mf button', bg)].pop();
    save.onclick = async () => {          // closes only when the fix was saved, so a mistake keeps the form
      try {
        const by = await needReviewer();
        const k = $('#fx-kind', bg).value;
        save.disabled = true;
        const r = await api('/api/fixes', {action: 'add', connection: cid, table, kind: k, column: k === 'combine' ? $('#fp-name', bg).value.trim() : $('#fx-col', bg).value,
          params: readFixParams(k, bg), by, note: $('#fx-note', bg).value});
        bg._close(r);
      } catch (e) { save.disabled = false; fail(e); }
    };
    const r = await done;
    if (!r) return;
    toast('Fix added. Applying it to every row…');
    const box = $('#fx-job');
    if (box) watchJob(r.job, box, j => { if (j.status === 'done') { toast('Data fix applied'); onDone && onDone(); } });
    else onDone && onDone();
  } catch (e) { fail(e); }
}

/* ------------------------------------------------------------------ key tools */
function keyTools(cid, table, d, reload) {
  const el = $('#kt-body'); if (!el) return;
  const keyish = c => /(^|_)(id|no|num|nbr|code|key|ref|number|uuid)$/i.test(c.name) || ['PRIMARY_KEY_CANDIDATE', 'FOREIGN_KEY_CANDIDATE', 'IDENTIFIER'].includes(c.suggested);
  const cols = [...d.columns].sort((a, b) => keyish(b) - keyish(a));
  el.innerHTML = `<p class="muted small" style="margin-top:0">Check whether a column, or several together, identifies every row: on <b>all</b> rows, not a sample. A key a table is known by must be unique and never empty, or joined totals count rows twice.</p>
    <div class="checkcols">${cols.map(c => `<label class="small"><input type="checkbox" class="kt-c" value="${esc(c.name)}"> ${esc(c.name)}</label>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="kt-go">Check on all rows</button></div><div id="kt-out"></div>`;
  $('#kt-go').onclick = async () => {
    const chosen = $$('.kt-c', el).filter(x => x.checked).map(x => x.value);
    if (!chosen.length) return toast('Tick one or more columns');
    const out = $('#kt-out'); out.innerHTML = '<div class="empty">Checking every row…</div>';
    try {
      const r = await api('/api/keys?connection=' + encodeURIComponent(cid) + '&table=' + encodeURIComponent(table) + '&columns=' + encodeURIComponent(chosen.join(',')));
      const name = chosen.join(' + ');
      out.innerHTML = `<div class="${r.unique ? 'note-box' : 'warn-box'} small"><b>${esc(name)}</b>: ${fmt(r.rows)} rows, ${fmt(r.distinct)} different values${r.missing_rows ? `, ${fmt(r.missing_rows)} empty` : ''}${r.duplicate_rows ? `, <b>${fmt(r.duplicate_rows)} rows repeat a value (${r.duplicate_pct}%)</b>` : ''}.
          ${r.unique ? ' Unique and never empty on every row: it can be the table\'s key.' : ' Not a key as it stands.'}</div>
        ${r.examples.length ? `<div class="small muted">Most repeated values</div><table class="t small"><tr><th>Value</th><th class="num">Rows</th></tr>${r.examples.map(x => `<tr><td><code>${esc(x.value)}</code></td><td class="num">${fmt(x.rows)}</td></tr>`).join('')}</table>` : ''}
        <div class="row" style="margin-top:8px">${S.state.demo ? '' : r.unique ? (chosen.length === 1 ? `<button class="btn sm good" id="kt-make" style="white-space:normal;text-align:left">Make ${esc(name)} the table's key</button>` : `<button class="btn sm primary" id="kt-combine">Create this combined key</button>`)
          : `<button class="btn sm" id="kt-dedupe">Keep one row for each value…</button>${chosen.length === 1 ? '<span class="small muted">or tick another column and check the combination</span>' : `<button class="btn sm" id="kt-combine">Combine anyway…</button>`}`}</div>`;
      if ($('#kt-make')) $('#kt-make').onclick = async () => {
        try {
          const by = await needReviewer();
          const note = await askText('Make it the table\'s key', `Approves ${name} as the key of ${table}. It was checked on all ${fmt(r.rows)} rows. Relationship discovery then uses it as a parent key.`, 'Why does it identify the rows?', '');
          if (!note) return;
          await api('/api/keys/make', {connection: cid, table, column: chosen[0], by, note});
          toast('Approved as the table\'s key. Run discovery again to find links to it.'); reload();
        } catch (e) { fail(e); }
      };
      if ($('#kt-combine')) $('#kt-combine').onclick = () => { S.fixPreset = {name: chosen.map(c => c.replace(/_(id|no|code|key|ref|number)$/i, '')).join('_') + '_key', params: {columns: chosen, sep: '|'}}; fixModal(cid, table, {kind: 'combine'}, reload).finally(() => S.fixPreset = null); };
      if ($('#kt-dedupe')) $('#kt-dedupe').onclick = () => { S.fixPreset = {params: {columns: chosen}}; fixModal(cid, table, {kind: 'dedupe'}, reload).finally(() => S.fixPreset = null); };
    } catch (e) { out.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; }
  };
}

/* ================================================================== review */
async function pageReview(tab, status, table) {
  tab = tab || 'roles';
  const titles = {roles: 'Column roles', relationships: 'Relationships', concepts: 'Business concepts', terms: 'Business terms',
    definitions: 'Definitions', issues: 'Issues', automatic: 'Automatic'};
  const p = setPage('review', 'Review');
  const o = S.overview || await api('/api/overview');
  const cnt = {roles: o.roles.pending + o.roles.stale, relationships: o.relationships.pending + o.relationships.stale, issues: o.issues || 0};
  p.innerHTML = `<div class="tabs">${Object.entries(titles).map(([k, l]) => `<a href="#review/${k}" class="${k === tab ? 'on' : ''}">${l}${cnt[k] ? `<span class="n">${fmt(cnt[k])} ${k === 'issues' ? 'open' : 'to review'}</span>` : ''}</a>`).join('')}</div>
    ${tab === 'relationships' ? `<div class="panel"><div class="head"><h2>Relationships</h2>${S.state.demo ? '' : '<button class="btn sm primary" id="rv-addlink">Add a relationship</button>'}</div><div id="rv-report"><div class="empty">Loading what discovery tried…</div></div></div>` : ''}<div id="rv"></div>`;
  if (tab === 'relationships') {
    const total = Object.values(o.relationships).reduce((a, b) => a + b, 0);
    if ($('#rv-addlink')) $('#rv-addlink').onclick = () => linkModal({}, () => route());
    discoveryReport($('#rv-report'), !total || o.relationships.pending + o.relationships.approved === 0).catch(e => { if (!e.stale && $('#rv-report')) $('#rv-report').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; });
  }
  if (tab === 'roles' || tab === 'relationships') return reviewList(tab, status || (cnt[tab] ? 'pending' : 'all'), table || '');
  if (tab === 'definitions') return reviewDefinitions();
  if (tab === 'issues') return reviewIssues(status || 'open');
  if (tab === 'automatic') return reviewAutomatic();
  return reviewArtifacts(tab);
}

async function reviewList(tab, status, table) {
  const el = $('#rv'); let offset = 0, items = [], total = 0, q = table || '';
  el.innerHTML = `<div class="panel flush"><div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line)">
      <select id="rv-st">${['pending', 'stale', 'approved', 'rejected', 'revoked', 'all'].map(s => `<option value="${s}" ${s === status ? 'selected' : ''}>${s === 'all' ? 'Everything' : STATUS[s]}</option>`).join('')}</select>
      <input type="text" id="rv-q" placeholder="Search table or column" value="${esc(q)}" style="flex:1;min-width:180px">
      ${tab === 'relationships' ? '<label class="small" title="Every child value found, unique parent key, score 0.95 or more"><input type="checkbox" id="rv-strong"> Strong evidence only</label>' : ''}
      <span class="muted small" id="rv-sel">0 selected</span>
      <button class="btn good sm" data-act="approve">Approve</button><button class="btn bad sm" data-act="reject">Reject</button>
      <button class="btn sm" data-act="revoke">Revoke</button><button class="btn sm" data-act="reopen">Reopen</button></div>
    <div class="scroll" style="max-height:66vh" id="rv-body"><div class="empty">Loading…</div></div><div id="rv-more" style="padding:10px 14px"></div></div>
    <p class="muted small">Click a row to see its evidence and decide one at a time. Approve uses the role or kind shown in each row. Revoke withdraws an approval; Reopen puts a rejected or revoked item back in the waiting list. Every decision is recorded with your name and a note.</p>`;
  const load = async (more) => {
    if (!more) { offset = 0; items = []; }
    const path = tab === 'roles'
      ? `/api/review/roles?status=${status}&q=${encodeURIComponent(q)}&offset=${offset}&limit=300`
      : `/api/review/relationships?status=${status}&q=${encodeURIComponent(q)}`;
    const d = await api(path); total = d.total; raw = (more ? raw : []).concat(d.items); offset = raw.length;
    items = strongOnly ? raw.filter(strong) : raw.slice();
    draw();
  };
  let strongOnly = false, raw = [];
  const strong = x => x.coverage === 100 && x.score >= 0.95 && (x.evidence || {}).parent_uniqueness_pct === 100;
  const draw = () => {
    const body = $('#rv-body');
    if (!body) return;   // the reviewer moved to another page while this list was loading
    if (!items.length) { body.innerHTML = `<div class="empty">${status === 'pending' ? 'Nothing is waiting for review here.' : 'No items match.'}</div>`; $('#rv-more').innerHTML = ''; return; }
    if (tab === 'roles') {
      body.innerHTML = `<table class="t"><tr><th style="width:28px"><input type="checkbox" id="rv-all" aria-label="Select all"></th><th>Table</th><th>Column</th><th>Role</th><th>Status</th><th>Decided</th><th></th></tr>${items.map((x, i) => {
        const cur = (x.decision && x.decision.approved && x.decision.approved.role) || x.suggested;
        return `<tr class="click" data-open="${i}" title="Open to see the evidence and decide"><td><input type="checkbox" class="rv-c" data-i="${i}" aria-label="Select"></td><td>${esc(x.table)}</td><td><b>${esc(x.column)}</b></td>
        <td><select class="rv-role" data-i="${i}" title="${esc((x.evidence || []).join('\n'))}">${ROLES.map(r => `<option value="${r}" ${r === cur ? 'selected' : ''}>${ROLE[r]}${r === x.suggested ? ' (suggested)' : ''}</option>`).join('')}</select></td>
        <td>${pill(x.status)}</td><td class="small muted">${x.decision ? esc(x.decision.actor) + '<br>' + esc(String(x.decision.at).slice(0, 10)) : ''}</td>
        <td>${x.decision ? `<button class="btn ghost sm" data-h="${esc(x.decision.id)}">History</button>` : ''}</td></tr>`; }).join('')}</table>`;
    } else {
      body.innerHTML = `<table class="t"><tr><th style="width:28px"><input type="checkbox" id="rv-all" aria-label="Select all"></th><th>From</th><th>To</th><th class="num">Score</th><th>Kind</th><th>Status</th><th>Evidence</th><th></th></tr>${items.map((x, i) => {
        const card = (x.decision && x.decision.approved && x.decision.approved.cardinality) || (x.hint === 'one_to_one' ? 'one_to_one' : 'many_to_one');
        return `<tr class="click" data-open="${i}" title="Open to see the evidence and decide"><td><input type="checkbox" class="rv-c" data-i="${i}" aria-label="Select"></td><td style="overflow-wrap:anywhere;min-width:160px">${esc(x.child_table)}.<b>${esc(x.child_column)}</b></td><td style="overflow-wrap:anywhere;min-width:160px">${esc(x.parent_table)}.<b>${esc(x.parent_column)}</b></td>
        <td class="num">${x.score.toFixed(2)}</td><td><select class="rv-card" data-i="${i}">${Object.entries(CARD).map(([k, v]) => `<option value="${k}" ${k === card ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td>${pill(x.status)}${x.freshness !== 'current' ? ' <span class="pill s-stale">table changed</span>' : ''}</td>
        <td class="small muted" style="min-width:220px;max-width:340px">${x.coverage != null ? `<b style="color:var(--ink)">${x.coverage}% of values found.</b> ` : ''}${esc((x.reasons || [])[0] || '')}</td>
        <td>${x.decision ? `<button class="btn ghost sm" data-h="${esc(x.decision.id)}">History</button>` : ''}</td></tr>`; }).join('')}</table>`;
    }
    $('#rv-more').innerHTML = raw.length < total ? `<button class="btn sm" id="rv-load">Show more (${fmt(total - raw.length)} left)</button>` : `<span class="muted small">${strongOnly ? fmt(items.length) + ' of ' : ''}${fmt(total)} item${total === 1 ? '' : 's'}</span>`;
    if ($('#rv-load')) $('#rv-load').onclick = () => load(true).catch(fail);
    const sel = () => { $('#rv-sel').textContent = $$('.rv-c').filter(c => c.checked).length + ' selected'; };
    $('#rv-all').onchange = e => { $$('.rv-c').forEach(c => c.checked = e.target.checked); sel(); };
    $$('.rv-c').forEach(c => c.onchange = sel); sel();
    $$('[data-h]').forEach(b => b.onclick = () => showHistory(b.dataset.h));
    $$('tr[data-open]', body).forEach(tr => tr.onclick = e => {
      if (e.target.closest('input,select,button,label,a')) return;
      const x = items[+tr.dataset.open];
      if (tab === 'roles') openRole(x.connection, x.table, x.column, () => load().catch(fail));
      else openRelationship(x.edge_id, () => load().catch(fail));
    });
  };
  if ($('#rv-strong')) $('#rv-strong').onchange = e => { strongOnly = e.target.checked; items = strongOnly ? raw.filter(strong) : raw.slice(); draw(); };
  $('#rv-st').onchange = e => { status = e.target.value; location.replace('#review/' + tab + '/' + status + '/' + encodeURIComponent(q)); };
  let timer; $('#rv-q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value; load().catch(fail); }, 250); };
  $$('[data-act]', el).forEach(b => b.onclick = async () => {
    const chosen = $$('.rv-c').filter(c => c.checked).map(c => +c.dataset.i);
    if (!chosen.length) return toast('Tick the rows first');
    try {
      const by = await needReviewer();
      const act = b.dataset.act;
      const note = await modal(`${act[0].toUpperCase() + act.slice(1)} ${chosen.length} item${chosen.length === 1 ? '' : 's'}`,
        `<p class="muted">The note is kept with each decision in the audit trail.</p><label class="f">Note<textarea id="m-in" rows="3">${esc({approve: 'Checked the evidence and the data', reject: 'Not correct for this data', revoke: 'No longer correct', reopen: 'Needs another look'}[act])}</textarea></label>`,
        [['Cancel', '', null], [act[0].toUpperCase() + act.slice(1), act === 'reject' ? 'bad' : 'primary', bg => $('#m-in', bg).value.trim() || null]]);
      if (!note) return;
      const payload = tab === 'roles'
        ? {action: act, by, note, items: chosen.map(i => ({connection: items[i].connection, table: items[i].table, column: items[i].column, role: $(`.rv-role[data-i="${i}"]`).value}))}
        : {action: act, by, note, items: chosen.map(i => ({edge_id: items[i].edge_id, cardinality: $(`.rv-card[data-i="${i}"]`).value, label: items[i].child_table + ' → ' + items[i].parent_table}))};
      const r = await api('/api/review/' + tab, payload);
      toast(`${r.done} recorded`);
      if (r.errors.length) modal('Some items were not changed', `<div class="warn-box">${r.errors.map(esc).join('<br>')}</div>`, [['Close', 'primary', null]]);
      S.overview = null; await load(); refreshBadges();
    } catch (e) { fail(e); }
  });
  await load();
}

/* ------------------------------------------------------------------ side panel */
function drawer(title) {
  const bg = document.createElement('div'); bg.className = 'drawer-bg';
  const dr = document.createElement('aside'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `<div class="dh"><h2></h2><button class="btn ghost" data-x aria-label="Close">✕</button></div><div class="db"><div class="empty">Loading…</div></div>`;
  const close = () => { bg.remove(); dr.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape' && !document.querySelector('.modal-bg')) close(); };
  $('[data-x]', dr).onclick = close; bg.onclick = close; document.addEventListener('keydown', esc_);
  document.body.append(bg, dr); $('h2', dr).textContent = title; $('[data-x]', dr).focus();
  return {el: dr, body: $('.db', dr), close, title: t => $('h2', dr).textContent = t};
}
const kpi = (v, label) => `<div class="kpi"><b>${v}</b><span>${esc(label)}</span></div>`;
const pct = v => v == null ? '–' : (Math.round(v * 10) / 10) + '%';
const vals = xs => xs && xs.length ? `<div class="vals">${xs.map(v => `<code>${esc(v)}</code>`).join('')}</div>` : '<span class="faint small">No sample values</span>';
function colCard(c, label) {
  const role = c.approved_role ? ROLE[c.approved_role] || c.approved_role : (c.suggested_role ? (ROLE[c.suggested_role] || c.suggested_role) + ' (suggested)' : '–');
  return `<div class="sidecard"><div class="k">${esc(label)}</div><div style="margin:4px 0 6px"><b>${esc(c.table)}.${esc(c.column)}</b></div>
    <dl class="dl"><dt>Type</dt><dd>${esc(c.type || '–')}</dd><dt>Rows read</dt><dd>${fmt(c.rows)}${c.sample_complete === false ? ' (sample)' : ''}</dd>
    <dt>Distinct</dt><dd>${fmt(c.distinct)} (${pct(c.distinct_pct)})</dd><dt>Missing</dt><dd>${fmt(c.missing)} (${pct(c.missing_pct)})</dd>
    <dt>Role</dt><dd>${esc(role)} ${pill(c.role_status === 'missing' ? 'pending' : c.role_status)}</dd></dl>
    ${(c.findings || []).length ? `<div class="warn-box small">${c.findings.map(esc).join('<br>')}</div>` : ''}
    <div class="small muted">Example values</div>${vals(c.samples)}
    <button class="btn sm" style="margin-top:10px" data-col="${esc(JSON.stringify([c.connection, c.table, c.column]))}">Open this column</button></div>`;
}
async function decisionNote(textarea) {
  const by = await needReviewer();
  const note = textarea.value.trim();
  if (!note) { textarea.focus(); throw new Error('Write the review rationale first: what evidence did you check?'); }
  return {by, note};
}

/* ------------------------------------------------------------------ relationship detail */
async function openRelationship(edgeId, onChange) {
  const dr = drawer('Relationship');
  const draw = async () => {
    const d = await api('/api/review/relationship?edge=' + encodeURIComponent(edgeId));
    const c = d.child, p = d.parent, ev = d.evidence, dec = d.decision || {}, ap = dec.approved || {};
    dr.title(`${c.table}.${c.column} → ${p.table}.${p.column}`);
    const current = d.freshness === 'current';
    const card = ap.cardinality || (d.hint === 'one_to_one' ? 'one_to_one' : 'many_to_one');
    const can = {approve: current && d.status !== 'approved', reject: current && ['pending', 'stale', 'approved'].includes(d.status),
                 reopen: ['rejected', 'revoked'].includes(d.status), revoke: dec.status === 'approved'};
    dr.body.innerHTML = `<div class="row">${pill(d.status)}${!current ? ' <span class="pill s-stale">table changed since discovery</span>' : ''}
        <span class="muted small" style="margin-left:auto">Score ${d.score.toFixed(2)}${d.score_label ? ' · ' + esc(d.score_label) : ''} · revision ${d.revision}</span></div>
      ${d.prerequisites_met ? '<div class="note-box">Both key columns are approved, so this link is ready for review.</div>'
        : `<div class="warn-box">Approve the key columns first: <b>${esc(c.column)}</b> is ${esc(STATUS[c.role_status] || c.role_status)}, <b>${esc(p.column)}</b> is ${esc(STATUS[p.role_status] || p.role_status)}. Questions use a link only when both its columns are approved.</div>`}
      <div class="kpis">${kpi(pct(ev.coverage_pct), 'child values found in the parent')}${kpi(fmt(ev.matched) + ' / ' + fmt(ev.child_keys), 'distinct keys matched')}
        ${kpi(pct(ev.parent_unique_pct), 'parent key unique')}${kpi(fmt((ev.child_missing || 0) + (ev.parent_missing || 0)), 'missing keys')}</div>
      ${ev.manual ? `<div class="note-box small"><b>Added by ${esc(ev.added_by)}</b>${ev.added_at ? ' on ' + esc(String(ev.added_at).slice(0, 10)) : ''}: ${esc(ev.added_note || '')}. Binggio did not propose it; the numbers above were measured on every row when it was added.
        ${d.status !== 'approved' && !S.state.demo ? ' <button class="btn ghost sm" id="rd-remove">Remove this link</button>' : ''}</div>` : ''}
      ${(ev.warnings || []).length ? `<div class="warn-box small">${ev.warnings.map(esc).join('<br>')}</div>` : ''}
      <ul class="checks">${(ev.reasons || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <div class="sec grid2">${colCard(c, 'Many side (child)')}${colCard(p, 'One side (parent)')}</div>
      <div class="sec"><h3>Check before you approve</h3><ul class="checks">${d.risks.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        ${(ev.limitations || []).length ? `<p class="faint small" style="margin-top:6px">${ev.limitations.map(esc).join(' · ')}</p>` : ''}</div>
      <div class="sec panel" style="margin-bottom:0"><h3>Your decision</h3>
        <div class="fields"><label class="f">Kind of link<select id="rd-card">${Object.entries(CARD).map(([k, v]) => `<option value="${k}" ${k === card ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="f">As-of rule (optional)<input type="text" id="rd-time" maxlength="400" placeholder="e.g. match on effective dates" value="${esc(ap.temporal_rule || '')}"></label></div>
        <label class="f">What this link means in business terms (optional)<textarea id="rd-join" rows="2" maxlength="400" placeholder="e.g. each claim belongs to one service visit">${esc(ap.join_note || '')}</textarea></label>
        <details style="margin:8px 0"><summary class="small">Join on different columns (advanced)</summary>
          <div class="fields"><label class="f">Child column<input type="text" id="rd-cc" maxlength="120" value="${esc(ap.child_column || c.column)}"></label>
          <label class="f">Parent column<input type="text" id="rd-pc" maxlength="120" value="${esc(ap.parent_column || p.column)}"></label></div>
          <p class="faint small">A changed column is your judgement: the discovery evidence above no longer supports it.</p></details>
        <label class="f">Review rationale (required)<textarea id="rd-note" rows="3" maxlength="600" placeholder="What evidence did you check?"></textarea></label>
        <div class="row" style="margin-top:10px">
          <button class="btn good" data-act="approve" ${can.approve ? '' : 'disabled'}>Approve</button>
          <button class="btn bad" data-act="reject" ${can.reject ? '' : 'disabled'}>Reject</button>
          <button class="btn" data-act="reopen" ${can.reopen ? '' : 'disabled'}>Reopen</button>
          <button class="btn" data-act="revoke" ${can.revoke ? '' : 'disabled'}>Revoke approval</button></div>
        ${!current ? '<p class="small" style="color:var(--red);margin-top:8px">The tables changed since this link was found. Profile and discover again before approving.</p>' : ''}</div>
      <div class="sec"><h3>History</h3>${eventsList(d.history)}</div>`;
    $$('[data-col]', dr.body).forEach(b => b.onclick = () => { const [cid, t, col] = JSON.parse(b.dataset.col); openRole(cid, t, col, () => { onChange && onChange(); draw().catch(fail); }); });
    if ($('#rd-remove', dr.body)) $('#rd-remove', dr.body).onclick = async () => {
      try {
        const by = await needReviewer();
        if (!await confirmBox('Remove this link', 'It is removed from the relationships and the map. Its history is kept.', 'Remove')) return;
        await api('/api/links', {action: 'remove', edge_id: edgeId, by}); toast('Link removed'); dr.close(); onChange && onChange();
      } catch (e) { fail(e); }
    };
    $$('[data-act]', dr.body).forEach(b => b.onclick = async () => {
      try {
        const {by, note} = await decisionNote($('#rd-note'));
        await api('/api/review/relationship', {edge_id: edgeId, action: b.dataset.act, by, note, expected_revision: d.revision,
          cardinality: $('#rd-card').value, temporal_rule: $('#rd-time').value, join_note: $('#rd-join').value,
          child_column_override: $('#rd-cc').value.trim() === c.column ? '' : $('#rd-cc').value.trim(),
          parent_column_override: $('#rd-pc').value.trim() === p.column ? '' : $('#rd-pc').value.trim()});
        toast('Decision recorded'); S.overview = null; refreshBadges(); onChange && onChange(); await draw();
      } catch (e) { fail(e); }
    });
  };
  draw().catch(e => { dr.body.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; });
}

/* ------------------------------------------------------------------ column role detail */
async function openRole(cid, table, column, onChange) {
  const dr = drawer(table + '.' + column);
  const draw = async () => {
    const d = await api(`/api/review/role?connection=${encodeURIComponent(cid)}&table=${encodeURIComponent(table)}&column=${encodeURIComponent(column)}`);
    const st = d.role_status === 'missing' ? 'pending' : d.role_status, dec = d.decision || {};
    const cur = d.approved_role || d.suggested_role;
    const can = {approve: !d.stale, reject: ['pending', 'stale', 'approved'].includes(st), reopen: ['rejected', 'revoked'].includes(st), revoke: dec.status === 'approved'};
    dr.body.innerHTML = `<div class="row">${pill(st)}${d.stale ? ' <span class="pill s-stale">table changed</span>' : ''}
        <span class="muted small" style="margin-left:auto">${d.decision ? 'revision ' + d.decision.revision : 'not decided yet'}</span></div>
      <div class="kpis">${kpi(esc(d.type || '–'), 'type')}${kpi(fmt(d.rows), d.sample_complete === false ? 'rows read (sample)' : 'rows read')}
        ${kpi(fmt(d.distinct) + ' (' + pct(d.distinct_pct) + ')', 'distinct values')}${kpi(fmt(d.missing) + ' (' + pct(d.missing_pct) + ')', 'missing')}</div>
      ${d.numeric ? `<p class="small muted">Min ${esc(d.numeric.min)} · max ${esc(d.numeric.max)}${d.numeric.mean != null ? ' · mean ' + esc(Math.round(d.numeric.mean * 100) / 100) : ''}</p>` : ''}
      <div class="small muted">Example values</div>${vals(d.samples)}
      ${(d.findings || []).length ? `<div class="warn-box small" style="margin-top:10px">${d.findings.map(esc).join('<br>')}</div>` : ''}
      <div class="sec"><h3>Suggested: ${esc(ROLE[d.suggested_role] || d.suggested_role || '–')}${d.confidence ? ` <span class="faint small">(${esc(d.confidence)} evidence)</span>` : ''}</h3>
        <ul class="checks">${(d.role_evidence || []).map(r => `<li>${esc(r)}</li>`).join('') || '<li class="muted">No evidence recorded</li>'}</ul></div>
      ${d.links.length ? `<div class="sec"><h3>Links that use this column</h3><ul class="checks">${d.links.map(l => `<li><a href="#" data-edge="${esc(l.edge_id)}">${esc(l.label)}</a> ${pill(l.status)}</li>`).join('')}</ul></div>` : ''}
      ${d.definitions.length ? `<div class="sec"><h3>Business definitions that use it</h3><ul class="checks">${d.definitions.map(x => `<li>${esc(x.name)} (${esc(x.aggregation)}) ${pill(x.status)}</li>`).join('')}</ul></div>` : ''}
      <div class="sec"><h3>Check before you approve</h3><ul class="checks">${d.checks.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
      <div class="sec panel" style="margin-bottom:0"><h3>Your decision</h3>
        <label class="f">Role<select id="ro-role">${d.roles.map(r => `<option value="${r}" ${r === cur ? 'selected' : ''}>${esc(ROLE[r] || r)}${r === d.suggested_role ? ' (suggested)' : ''}</option>`).join('')}</select></label>
        <label class="f">Review rationale (required)<textarea id="ro-note" rows="3" maxlength="600" placeholder="What did you check?"></textarea></label>
        <div class="row" style="margin-top:10px"><button class="btn good" data-act="approve" ${can.approve ? '' : 'disabled'}>Approve role</button>
          <button class="btn bad" data-act="reject" ${can.reject ? '' : 'disabled'}>Reject</button>
          <button class="btn" data-act="reopen" ${can.reopen ? '' : 'disabled'}>Reopen</button>
          <button class="btn" data-act="revoke" ${can.revoke ? '' : 'disabled'}>Revoke approval</button></div></div>
      <div class="sec"><h3>History</h3>${eventsList(d.history)}</div>`;
    $$('[data-edge]', dr.body).forEach(a => a.onclick = e => { e.preventDefault(); openRelationship(a.dataset.edge, onChange); });
    $$('[data-act]', dr.body).forEach(b => b.onclick = async () => {
      try {
        const {by, note} = await decisionNote($('#ro-note'));
        const r = await api('/api/review/roles', {action: b.dataset.act, by, note, items: [{connection: cid, table, column, role: $('#ro-role').value}]});
        if (r.errors.length) throw new Error(r.errors.join('; '));
        toast('Decision recorded'); S.overview = null; refreshBadges(); onChange && onChange(); await draw();
      } catch (e) { fail(e); }
    });
  };
  draw().catch(e => { dr.body.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; });
}

/* ------------------------------------------------------------------ business definitions */
async function reviewDefinitions(showAll) {
  const el = $('#rv');
  const d = await api('/api/review/definitions');
  if (!el.isConnected) return;
  const hidden = d.items.filter(x => ['rejected', 'revoked'].includes(x.status)).length;
  if (!showAll) d.items = d.items.filter(x => !['rejected', 'revoked'].includes(x.status));
  d.items.sort((a, b) => ({approved: 0, stale: 1, draft: 2, pending: 2}[a.status] ?? 3) - ({approved: 0, stale: 1, draft: 2, pending: 2}[b.status] ?? 3));
  const AGG = {SUM: 'Total (sum)', AVG: 'Average', MIN: 'Minimum', MAX: 'Maximum', COUNT: 'Count', COUNT_DISTINCT: 'Count of distinct'};
  const colLabel = s => `${s.table}.${s.column}`;
  el.innerHTML = `<div class="panel"><div class="head"><h2>Add a business definition</h2></div>
      <p class="muted">Give a business name one exact calculation, such as "Outstanding exposure = total of loan_accounts.outstanding_balance". Approved definitions are used when a question names them. Binggio suggests some, but a person always approves.</p>
      ${d.measures.length ? `<div class="fields"><label class="f">Business name<input type="text" id="df-name" maxlength="100" placeholder="Outstanding exposure"></label>
        <label class="f">Calculation<select id="df-agg">${d.aggregations.map(a => `<option value="${a}" ${a === 'SUM' ? 'selected' : ''}>${esc(AGG[a] || a)}</option>`).join('')}</select></label>
        <label class="f">Of the column (approved measures)<select id="df-col">${d.measures.map((m, i) => `<option value="${i}">${esc(colLabel(m))}</option>`).join('')}</select></label>
        <label class="f">Business area<input type="text" id="df-domain" maxlength="80" placeholder="Lending"></label></div>
        <label class="f">What it means<textarea id="df-desc" rows="2" maxlength="600" placeholder="Total balance still owed on loans, before provisions"></textarea></label>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="df-add">Add as a draft</button><span class="muted small">Drafts are approved below by a reviewer.</span></div>`
      : '<div class="warn-box">Approve at least one column as a <b>Measure</b> first (Review › Column roles); definitions are built on approved measures.</div>'}</div>
    ${d.suggestions.length ? `<div class="panel"><div class="head"><h2>Suggested by Binggio</h2></div><p class="muted small">Never approved automatically: check what to include and the sign convention.</p>
      <table class="t">${d.suggestions.map((x, i) => `<tr><td><b>${esc(x.name)}</b><div class="faint small">${esc(x.warning || '')}</div></td><td>${esc(AGG[x.aggregation] || x.aggregation)}</td>
        <td style="text-align:right"><button class="btn sm" data-sug="${i}">Use this</button></td></tr>`).join('')}</table></div>` : ''}
    <div class="panel flush"><div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line)"><h2 style="flex:1;margin:0">Definitions</h2>
      ${hidden ? `<label class="small"><input type="checkbox" id="df-all" ${showAll ? 'checked' : ''}> Show rejected and revoked (${hidden})</label>` : ''}</div>
    ${d.items.length ? `<table class="t"><tr><th>Name</th><th>Calculation</th><th>Status</th><th>Decided</th><th></th></tr>${d.items.map((x, i) => `<tr>
        <td><b>${esc(x.name)}</b><div class="faint small">${esc(x.description || '')}${x.domain ? ' · ' + esc(x.domain) : ''}</div></td>
        <td>${esc(AGG[x.aggregation] || x.aggregation)} of ${x.sources.map(s => esc(colLabel(s))).join(', ')}</td><td>${pill(x.status)}</td>
        <td class="small muted">${esc(x.actor)}<br>${esc(String(x.at).slice(0, 10))}</td>
        <td style="white-space:nowrap">${x.status !== 'approved' && !['rejected', 'revoked'].includes(x.status) ? `<button class="btn good sm" data-a="approve" data-i="${i}">Approve</button> ` : ''}
          ${['draft', 'pending', 'stale'].includes(x.status) ? `<button class="btn bad sm" data-a="reject" data-i="${i}">Reject</button> ` : ''}
          ${x.stored_status === 'approved' ? `<button class="btn sm" data-a="revoke" data-i="${i}">Revoke</button> ` : ''}
          ${['rejected', 'revoked'].includes(x.status) ? `<button class="btn sm" data-a="reopen" data-i="${i}">Reopen</button> ` : ''}
          <button class="btn ghost sm" data-h="${esc(x.id)}">History</button></td></tr>`).join('')}</table>`
      : '<div class="empty">No business definitions yet.</div>'}</div>`;
  $$('[data-h]', el).forEach(b => b.onclick = () => showHistory(b.dataset.h));
  if ($('#df-all')) $('#df-all').onchange = e => reviewDefinitions(e.target.checked).catch(fail);
  $$('[data-sug]', el).forEach(b => b.onclick = () => {
    const x = d.suggestions[+b.dataset.sug], i = d.measures.findIndex(m => m.connection === x.ref.connection_id && m.table === x.ref.table && m.column === x.ref.column);
    if (i < 0) return toast('Approve that column as a Measure first');
    $('#df-name').value = x.name; $('#df-agg').value = x.aggregation; $('#df-col').value = i; $('#df-name').focus();
  });
  if ($('#df-add')) $('#df-add').onclick = async () => {
    try {
      const by = await needReviewer(), m = d.measures[+$('#df-col').value];
      if (!$('#df-name').value.trim() || !$('#df-desc').value.trim()) throw new Error('Give the definition a name and say what it means');
      await api('/api/review/definitions', {action: 'create', by, note: 'Drafted in the Binggio app',
        definition: {name: $('#df-name').value, description: $('#df-desc').value, domain: $('#df-domain').value || 'General', aggregation: $('#df-agg').value,
                     connection: m.connection, table: m.table, column: m.column}});
      toast('Draft added: approve it below'); reviewDefinitions(showAll);
    } catch (e) { fail(e); }
  };
  $$('[data-a]', el).forEach(b => b.onclick = async () => {
    const x = d.items[+b.dataset.i], act = b.dataset.a;
    try {
      const by = await needReviewer();
      const note = await askText(`${act[0].toUpperCase() + act.slice(1)} "${x.name}"`, 'The note is kept with the decision in the audit trail.', 'Note',
        {approve: 'Calculation and meaning checked', reject: 'Not correct', revoke: 'No longer correct', reopen: 'Needs another look'}[act]);
      if (!note) return;
      await api('/api/review/definitions', {id: x.id, action: act, by, note});
      toast('Decision recorded'); reviewDefinitions(showAll);
    } catch (e) { fail(e); }
  });
}

const OPS = {eq: '=', ne: '≠', gt: '>', gte: '≥', lt: '<', lte: '≤', in: 'is one of', not_in: 'is not one of', like: 'contains', is_null: 'is empty', not_null: 'is not empty', null: 'is empty'};
function condText(table, c) {
  const left = (table ? table + '.' : '') + c.column, op = OPS[c.op] || c.op;
  if (['is_null', 'not_null', 'null'].includes(c.op)) return `${left} ${op}`;
  if (c.value_column) return `${left} ${op} ${c.value_column}`;
  if (c.as_of_offset_days != null) {
    const n = +c.as_of_offset_days;
    return `${left} ${op} the as-of date${n ? (n > 0 ? ' + ' : ' − ') + Math.abs(n) + ' days' : ''}`;
  }
  return `${left} ${op} ${Array.isArray(c.value) ? c.value.join(', ') : c.value}`;
}
