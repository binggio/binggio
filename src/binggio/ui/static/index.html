          <ol class="checks" style="margin-top:6px">${pth.steps.map(st => `<li><a href="#" data-edge="${esc(st.edge_id)}">${esc(st.label)}</a> ${pill(st.status)}</li>`).join('')}</ol></div>`).join('')
        : '<div class="empty">No chain of up to 4 links connects these tables. Approve or add a link between them first.</div>';
      $$('[data-edge]', $('#pf-out')).forEach(a => a.onclick = ev => { ev.preventDefault(); openRelationship(a.dataset.edge, () => route()); });
      render();
    } catch (e) { fail(e); }
  };
  $('#g-show').value = show;
  $('#g-show').onchange = e => { show = e.target.value; store.set('graphshow', show); draw(); };
  const palette = ['#2357c6', '#13846e', '#ae6910', '#8a3fb5', '#c2410c', '#0e7490', '#4d7c0f', '#be185d', '#475569'];
  const srcIdx = {}; d.nodes.forEach(n => { if (!(n.connection in srcIdx)) srcIdx[n.connection] = Object.keys(srcIdx).length; });
  const color = n => palette[srcIdx[n.connection] % palette.length];
  const ecolor = {approved: 'var(--green)', pending: 'var(--amber)', stale: 'var(--red)', rejected: '#c5ccd6', revoked: '#c5ccd6'};
  const svg = $('#gsvg'); const W = $('#g').clientWidth, H = 640;
  let view = {x: 0, y: 0, k: 1}, nodes, edges, byId;
  function layout() {
    const vis = d.edges.filter(e => show === 'all' || e.status === 'approved' || (show === 'approved+pending' && (e.status === 'pending' || e.status === 'stale')));
    const used = new Set(); vis.forEach(e => { used.add(e.source); used.add(e.target); });
    // With no links to show yet, every table is shown, so links can be drawn between them.
    nodes = d.nodes.filter(n => used.has(n.id) || show === 'all' || drawing || !vis.length).map(n => ({...n, x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80)}));
    byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    edges = vis.filter(e => byId[e.source] && byId[e.target] && e.source !== e.target);
    // Fruchterman-Reingold inside the frame, with gravity so separate groups stay close
    const area = W * H, k = Math.sqrt(area / Math.max(nodes.length, 1)) * 0.75, N = 400;
    let temp = W / 8;
    for (let it = 0; it < N; it++) {
      for (const a of nodes) { a.dx = 0; a.dy = 0; }
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; const dist = Math.max(Math.hypot(dx, dy), 0.5);
        if (dist > 3 * k) continue;
        const f = k * k / dist; a.dx += dx / dist * f; a.dy += dy / dist * f; b.dx -= dx / dist * f; b.dy -= dy / dist * f;
      }
      for (const e of edges) {
        const a = byId[e.source], b = byId[e.target]; const dx = a.x - b.x, dy = a.y - b.y; const dist = Math.max(Math.hypot(dx, dy), 0.5);
        const f = dist * dist / k; a.dx -= dx / dist * f; a.dy -= dy / dist * f; b.dx += dx / dist * f; b.dy += dy / dist * f;
      }
      for (const a of nodes) {
        a.dx += (W / 2 - a.x) * 0.9; a.dy += (H / 2 - a.y) * 0.9;
        const m = Math.max(Math.hypot(a.dx, a.dy), 0.01), step = Math.min(m, temp);
        a.x = Math.min(W - 20, Math.max(20, a.x + a.dx / m * step)); a.y = Math.min(H - 20, Math.max(20, a.y + a.dy / m * step));
      }
      temp = Math.max(1, temp * 0.985);
    }
    // fit to view
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    if (nodes.length) {
      const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
      const s = Math.min((W - 120) / Math.max(maxx - minx, 1), (H - 80) / Math.max(maxy - miny, 1), 2);
      view = {k: s, x: W / 2 - (minx + maxx) / 2 * s, y: H / 2 - (miny + maxy) / 2 * s};
    }
  }
  function render() {
    const r0 = 7 / Math.sqrt(view.k);
    svg.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
      <g transform="translate(${view.x},${view.y}) scale(${view.k})">${edges.map((e, i) => {
      const a = byId[e.source], b = byId[e.target];
      const len = Math.max(Math.hypot(b.x - a.x, b.y - a.y), 1), ex = b.x - (b.x - a.x) / len * (r0 + 2 / view.k), ey = b.y - (b.y - a.y) / len * (r0 + 2 / view.k);
      const dash = e.status === 'pending' ? '5 4' : (e.status === 'rejected' || e.status === 'revoked') ? '2 4' : '';
      return `<line x1="${a.x}" y1="${a.y}" x2="${ex}" y2="${ey}" marker-end="url(#arr)" stroke="${highlight.has(e.edge_id) ? 'var(--blue)' : (ecolor[e.status] || '#999')}" stroke-width="${(highlight.has(e.edge_id) ? 4.5 : 1.6) / view.k}" ${dash ? `stroke-dasharray="${dash}"` : ''} data-e="${i}" style="cursor:pointer"/>
        <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="${10 / view.k}" data-e="${i}" style="cursor:pointer"/>`; }).join('')}
      ${nodes.map((n, i) => `<g data-n="${i}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${7 / Math.sqrt(view.k)}" fill="${color(n)}" stroke="#fff" stroke-width="${1.5 / view.k}"/>
        <text x="${n.x + 9 / view.k}" y="${n.y + 4 / view.k}" style="font-size:${11 / view.k}px">${esc(n.table)}</text></g>`).join('')}
      ${rubber ? `<line x1="${rubber.a.x}" y1="${rubber.a.y}" x2="${rubber.x}" y2="${rubber.y}" stroke="var(--blue)" stroke-width="${2 / view.k}" stroke-dasharray="4 3" marker-end="url(#arr)" pointer-events="none"/>` : ''}</g>`;
    $$('[data-e]', svg).forEach(l => l.onclick = ev => { ev.stopPropagation(); sideEdge(edges[+l.dataset.e]); });
    $$('[data-n]', svg).forEach(g => g.onclick = ev => { ev.stopPropagation(); sideNode(nodes[+g.dataset.n]); });
  }
  const side = $('#g-side');
  function sideEdge(e) {
    side.hidden = false;
    side.innerHTML = `<div class="row"><h3 style="flex:1;margin:0">Relationship</h3><button class="btn ghost sm" id="gs-x" aria-label="Close">✕</button></div>
      <p style="margin:8px 0">${esc(e.child_table)}.<b>${esc(e.child_column)}</b><br>→ ${esc(e.parent_table)}.<b>${esc(e.parent_column)}</b></p>

    $('#gs-x').onclick = () => side.hidden = true;

  }
  function sideNode(n) {
    const links = edges.filter(e => e.source === n.id || e.target === n.id);
    side.hidden = false;
    side.innerHTML = `<div class="row"><h3 style="flex:1;margin:0">${esc(n.table)}</h3><button class="btn ghost sm" id="gs-x" aria-label="Close">✕</button></div>
      <p class="muted small" style="margin:4px 0 8px">${esc(n.source)}</p><p class="small">${links.length} link${links.length === 1 ? '' : 's'} shown</p>
      <a class="btn sm" href="#explore/${encodeURIComponent(n.connection)}/${encodeURIComponent(n.table)}">Explore table</a>

    $('#gs-x').onclick = () => side.hidden = true;
    if ($('#gs-link')) $('#gs-link').onclick = () => linkModal({child: {connection: n.connection, table: n.table}}, () => route());
  }
  function draw() { layout(); render(); }
  // pan and zoom; in drawing mode, drag from one table to another to link them
  let drag = null, drawing = false, rubber = null;
  const toWorld = e => { const r = svg.getBoundingClientRect(); return {x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k}; };
  const nodeAt = e => {
    const g = e.target.closest && e.target.closest('[data-n]'); if (g) return nodes[+g.dataset.n];
    const w = toWorld(e), r = 16 / view.k;      // the nearest table under the pointer, if any
    let best = null, bd = r;

  };
  svg.onmousedown = e => {
    const n = drawing && nodeAt(e);
    if (n) { e.preventDefault(); rubber = {a: n, ...toWorld(e)}; return; }

  };
  window.onmouseup = e => {
    if (rubber) {
      const from = rubber.a, to = nodeAt(e); rubber = null; render();
      if (to && to.id !== from.id) linkModal({child: {connection: from.connection, table: from.table}, parent: {connection: to.connection, table: to.table}}, () => route());
      return;
    }
    drag = null; svg.style.cursor = drawing ? 'crosshair' : 'grab';
  };
  svg.onmousemove = e => {
    if (rubber) { Object.assign(rubber, toWorld(e)); render(); return; }
    if (!drag) return; view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; render();
  };

    e.preventDefault(); const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.15 : 1 / 1.15; view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f; render();
  };
  draw();
}


/* ------------------------------------------------------------------ add a relationship yourself */
const sing = w => w.replace(/ies$/, 'y').replace(/([^s])s$/, '$1');
const ALIAS = {customer: ['cust', 'client', 'party'], account: ['acct', 'acc'], transaction: ['txn', 'trans'], product: ['prod'], merchant: ['merch']};
const subjectOf = t => sing((t || '').toLowerCase().split(/[_\s]+/).filter(w => !['master', 'list', 'data', 'table', 'details', 'directory', 'dim', 'fact'].includes(w)).pop() || '');
const keyish = c => /(^|_)(id|no|num|nbr|code|key|ref|number)$/i.test(c);
function guessColumn(cols, side, table, otherTable, otherCol) {
  const lc = cols.map(c => c.toLowerCase());
  if (side === 'parent') {
    // the parent's own key: customer_id in customers
    const subj = subjectOf(table);
    const own = cols.find(c => keyish(c) && c.toLowerCase().startsWith(subj)); if (own) return own;
    if (otherCol) { const i = lc.indexOf(otherCol.toLowerCase()); if (i >= 0) return cols[i]; }
    return cols.find(keyish) || cols[0];
  }
  // the child column that refers to the parent: same name, or a name that says the parent (cust_ref, card_acct)
  if (otherCol) { const i = lc.indexOf(otherCol.toLowerCase()); if (i >= 0) return cols[i]; }
  const subj = subjectOf(otherTable), words = [subj, ...(ALIAS[subj] || [])].filter(Boolean);
  const own = subjectOf(table);
  const named = cols.filter(c => words.some(w => c.toLowerCase().split(/[_\s]+/).some(x => sing(x) === w || x.startsWith(w))));
  if (named.length) return named.find(keyish) || named[0];
  return cols.find(c => keyish(c) && !c.toLowerCase().startsWith(own)) || cols.find(keyish) || cols[0];
}

const short = x => { const a = Math.abs(x); return a >= 1e9 ? (x / 1e9).toFixed(1) + 'B' : a >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : a >= 1e4 ? (x / 1e3).toFixed(1) + 'K' : (+x).toLocaleString(undefined, {maximumFractionDigits: 2}); };
function barsChart(c) {

function lineChart(c) {

      <div class="composer"><textarea id="qbox" placeholder="Ask a question about your approved data" aria-label="Question"></textarea>
        <button class="btn primary" id="qsend">Ask</button></div></div>
    <div><div class="panel"><div class="row" style="margin-bottom:8px"><h3 style="flex:1;margin:0">Conversation</h3><button class="btn sm" id="qnew">New conversation</button></div>
      <p class="muted small" style="margin:0">Binggio answers only from approved tables, links and business terms. If something is missing it says what, instead of guessing.</p></div>
      ${samples.length ? `<div class="panel samples"><h3>Sample questions</h3><p class="muted small">Prepared for the sample bank. They run without a model key.</p>
        ${samples.map((s, i) => `<button data-s="${i}">${esc(s.steps[0].question)}${s.steps.length > 1 ? `<span class="faint small"> + ${s.steps.length - 1} follow-up${s.steps.length > 2 ? 's' : ''}</span>` : ''}</button>`).join('')}</div>` : ''}</div></div>`;
  THREAD.forEach(t => appendTurn(t, false));
  const pre = store.get('prefill', null); if (pre) { $('#qbox').value = pre; store.set('prefill', null); $('#qbox').focus(); }
  const send = async (question, plan) => {
    if (!question.trim()) return;
    if ($('#ask-empty')) $('#ask-empty').remove();
    const turn = {question, answer: null}; THREAD.push(turn); const el = appendTurn(turn, true);
    try {
      const r = await api('/api/ask', {question, conversation: CONV, plan});
      CONV = r.conversation; store.set('conv', CONV); turn.answer = r.answer;
    } catch (e) { turn.answer = {status: 'refused', code: 'ERROR', message: e.message, hints: []}; }
    el.replaceWith(answerCard(turn)); window.scrollTo({top: document.body.scrollHeight});
  };
  $('#qsend').onclick = () => { const q = $('#qbox').value; $('#qbox').value = ''; send(q); };
  $('#qbox').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#qsend').click(); } });
  $('#qnew').onclick = async () => { const r = await api('/api/ask/new', {}); CONV = r.conversation; store.set('conv', CONV); THREAD = []; pageAsk(); };
  $$('[data-s]').forEach(b => b.onclick = async () => {
    const s = samples[+b.dataset.s];
    const r = await api('/api/ask/new', {}); CONV = r.conversation; store.set('conv', CONV);
    for (const step of s.steps) await send(step.question, step.plan);
  });
}
function appendTurn(turn, pending) {
  const th = $('#thread');
  th.insertAdjacentHTML('beforeend', `<div class="q">${esc(turn.question)}</div>`);
  const holder = document.createElement('div');
  if (pending && !turn.answer) { holder.className = 'a'; holder.innerHTML = '<div class="ah muted">Working on it…</div>'; }
  else holder.appendChild(answerCard(turn));
  th.appendChild(holder); return holder;
}
function answerCard(turn) {
  const a = turn.answer, d = document.createElement('div');
  if (a.status === 'refused') {
    d.className = 'a refusal';
    d.innerHTML = `<div class="ah"><b>Not answered</b><span class="muted small">${esc(a.code || '')}</span></div><div style="padding:12px 16px">${esc(a.message)}
      ${(a.hints || []).length ? `<ul>${a.hints.map(h => `<li>${esc(h.detail || h.message || JSON.stringify(h))}</li>`).join('')}</ul>` : ''}
      ${a.code === 'MODEL_NOT_CONFIGURED' ? '<p style="margin-top:8px"><a href="#settings">Add a model key</a></p>' : ''}
      ${['UNSUPPORTED_OR_AMBIGUOUS', 'NOTHING_APPROVED'].includes(a.code) ? '<p style="margin-top:8px"><a href="#review">Open the review lists</a></p>' : ''}</div>`;
    return d;
  }
  d.className = 'a';
  const n = a.row_count ?? a.rows.length;
  d.innerHTML = `<div class="ah"><b>${fmt(n)} row${n === 1 ? '' : 's'}</b>${a.truncated ? `<span class="muted small">showing the first ${a.rows.length}</span>` : ''}
      <span style="flex:1"></span><button class="btn sm" data-csv>Download CSV</button></div>
    <div class="tablewrap"><table class="t"><tr>${a.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${a.rows.map(r => `<tr>${r.map(v => `<td class="${typeof v === 'number' ? 'num' : ''}">${esc(typeof v === 'number' ? v.toLocaleString() : v)}</td>`).join('')}</tr>`).join('')}</table></div>
    <dl class="prov"><dt>From</dt><dd>${a.sources.map(s => `<span class="src" title="${esc(s.source)}">${esc(s.table)}</span>`).join('')}</dd>
      ${a.business_terms.length ? `<dt>Terms</dt><dd>${a.business_terms.map(t => `<span class="term"><b>${t.negated ? 'not ' : ''}${esc(t.term)}</b>: ${esc(t.meaning)}</span>`).join('')}</dd>` : ''}
      ${a.as_of ? `<dt>As of</dt><dd>${esc(a.as_of)}</dd>` : ''}
      <dt>Steps</dt><dd>${a.explanation.map(s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')).join('; ')}</dd>
      <dt></dt><dd><details><summary>Query that ran</summary><pre>${esc(a.sql)}</pre><div class="faint small">Parameters: ${esc(JSON.stringify(a.parameters))}</div></details></dd></dl>`;
  d.querySelector('[data-csv]').onclick = () => {
    const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = [a.columns.map(q).join(','), ...a.rows.map(r => r.map(q).join(','))].join('\r\n');
    const url = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'}));
    const link = document.createElement('a'); link.href = url; link.download = 'binggio-answer.csv'; link.click(); URL.revokeObjectURL(url);
  };
  return d;
}

/* ================================================================== activity */
async function pageActivity() {
  const p = setPage('activity', 'Activity');
  const d = await api('/api/history?limit=500');
  p.innerHTML = `<div class="panel"><div class="row"><p class="muted" style="flex:1;margin:0">Every decision, newest first. Names are as people entered them.</p>
      <button class="btn sm" id="act-csv">Download the audit trail (CSV)</button></div>${eventsList(d.items)}</div>`;
  $('#act-csv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = d.items.map(e => [e.at, e.actor, e.action, e.artifact_id, e.revision, e.note]);
    const csv = [['when', 'who', 'action', 'item', 'revision', 'note'].map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n');
    const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type: 'text/csv'}));
    const link = document.createElement('a'); link.href = url; link.download = 'binggio-audit-trail.csv'; link.click(); URL.revokeObjectURL(url);
  };
}

/* ================================================================== settings */
async function pageSettings() {
  const p = setPage('settings', 'Settings');
  const m = S.state.model;
  p.innerHTML = `<div class="grid2"><div class="panel"><h2>Your name</h2><p class="muted">Recorded with every approval, rejection and revocation you make in this browser.</p>
      <div class="row"><input type="text" id="s-by" value="${esc(reviewer())}" style="flex:1"><button class="btn primary" id="s-by-save">Save</button></div></div>
    <div class="panel"><h2>Model for questions in your own words</h2>
      <p class="muted">Binggio sends the question and the names of approved tables and columns to the model, never your data rows. ${m.configured ? `A key is set (${esc(m.from || 'environment')}).` : 'No key is set.'}</p>
      <div class="fields" style="grid-template-columns:1fr"><label class="f">API key<input type="password" id="s-key" placeholder="${m.configured ? 'Replace the key' : 'Paste your key'}" autocomplete="off"></label>
      <label class="f">Model<input type="text" id="s-model" value="${esc(m.model)}"></label></div>
      <div class="row"><button class="btn primary" id="s-key-save">Use this key</button>${m.from === 'this session' ? '<button class="btn" id="s-key-clear">Forget the key</button>' : ''}</div>
      <p class="muted small" style="margin-top:10px">The key stays in memory until you close Binggio; it is never written to disk. To keep one, set BINGGIO_LLM_API_KEY before running binggio ui.</p></div></div>
    <div class="panel"><h2>Licence</h2><p>Binggio ${esc(S.state.version)} is free software under the GNU Affero General Public License, version 3 or later. You may use, study, share and change it. If you change it and let others use it over a network, you must offer them your changed source code.</p>
      <p class="muted">The licence text is in the LICENSE file of the source code. For use under other terms, a commercial licence is available from Ashish Kumar.</p>
      <p>Feedback, questions, commercial licences and partnerships: <a href="#" data-mail="Binggio feedback">${CONTACT}</a>. Security issues: <a href="#" data-mail="Security">${CONTACT}</a> with "Security" in the subject.</p>
      <p class="muted">Binggio™ and the Binggio logo are trademarks of Ashish Kumar. The licence covers the code, not the name: a modified version must use a different name (see TRADEMARKS.md).</p></div>
        <div class="panel"><h2>Workspace</h2><p><b>${esc(S.state.workspace)}</b></p><p class="muted">Sources, profiles, approvals and the audit trail are kept in this folder. Copy or move it as a whole.</p>
      <div class="row"><button class="btn" id="s-switch">Switch workspace</button><button class="btn" id="s-reprofile">Profile and discover again</button></div><div id="s-job"></div></div>`;
  $('#s-by-save').onclick = () => { store.set('by', $('#s-by').value.trim()); renderTop(); toast('Saved'); };
  $('#s-key-save').onclick = async () => {
    try { S.state.model = await api('/api/settings/model', {key: $('#s-key').value, model: $('#s-model').value}); renderTop(); toast(S.state.model.configured ? 'Key in use' : 'Saved'); pageSettings(); } catch (e) { fail(e); }
  };
  if ($('#s-key-clear')) $('#s-key-clear').onclick = async () => { S.state.model = await api('/api/settings/model', {clear: true}); renderTop(); pageSettings(); };
  $('#s-switch').onclick = () => startScreen(true);
  $$('[data-mail]').forEach(a => a.onclick = e => { e.preventDefault(); location.href = feedbackLink(a.dataset.mail); });
  $('#s-reprofile').onclick = async () => {
    try { const job = await api('/api/pipeline', {}); watchJob(job, $('#s-job'), j => { if (j.status === 'done') { toast('Done'); refreshBadges(); } }); } catch (e) { fail(e); }
  };
}

/* ------------------------------------------------------------------ boot */
(async () => {
  try { S.state = await api('/api/state'); route(); }
  catch (e) { $('#root').innerHTML = `<div class="page"><div class="err-box">${esc(e.message)}</div></div>`; }
})();
</script>
</body>
